[project]
name = "nonebot-plugin-ba-tools"
version = "0.5.9.post3"
description = "一个BlueArchive工具箱"
authors = [
    { name = "hanasaki", email = "hanasakayui2022@gmail.com" },
    { name = "kawaiior", email = "kawaiiorv@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "deepdiff>=8.6.1",
    "httpx>=0.28.1",
    "nonebot-plugin-alconna>=0.60.4",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-htmlkit>=0.1.0rc5",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-orm>=0.8.3",
    "nonebot-plugin-uninfo>=0.10.1",
    "nonebot2>=2.4.4",
    "openai>=2.16.0",
    "pillow>=12.1.0",
    "psutil>=7.2.2",
    "pyjwt>=2.10.1",
    "pyyaml>=6.0.3",
]

[project.urls]
homepage = "https://github.com/hanasa2023/nonebot-plugin-ba-tools#readme"
repository = "https://github.com/hanasa2023/nonebot-plugin-ba-tools"

[dependency-groups]
dev = [
    "basedpyright>=1.37.2",
    "mypy>=1.19.1",
    "nonebot-adapter-milky>=1.0.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-orm[default]>=0.8.3",
    "nonebot2[fastapi,httpx]>=2.4.4",
    "nonebug>=0.4.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.nonebot]
plugin_dirs = [""]
builtin_plugins = []

[tool.nonebot.adapters]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-alconna = ["nonebot_plugin_alconna"]
nonebot-plugin-uninfo = ["nonebot_plugin_uninfo"]
nonebot-plugin-orm = ["nonebot_plugin_orm"]
nonebot-plugin-htmlkit = ["nonebot_plugin_htmlkit"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST", # FastAPI
    "PERF", # Perflint
    "PGH",  # pygrep-hooks
    "FURB", # refurb
    "TRY",  # tryceratops
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E402",  # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",  # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037", # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    # "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
    "PLR2004",
    "BLE001",  # blind-except - used for general error logging
    "PERF203", # try-except-in-loop - acceptable for robustness in scheduled tasks
]
allowed-confusables = [
    "，",
    "。",
    "“",
    "”",
    "：",
    "；",
    "？",
    "！",
    "【",
    "】",
    "《",
    "》",
    "…",
    "—",
    "（",
    "）",
    "、",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.basedpyright]
# For BasedPyright configurations, see https://docs.basedpyright.com/latest/configuration/config-files/.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"

[tool.mypy]
# For MyPy configurations, see https://mypy.readthedocs.io/en/latest/config_file.html.
python_version = "3.10"
